name: Nexus CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    runs-on: ubuntu-latest
    name: Build & Test Nexus
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.24'
    
    - name: Start Redis
      uses: supercharge/redis-github-action@1.2.0
      with:
       redis-version: 5

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
